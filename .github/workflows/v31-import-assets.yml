name: Import Farm World V3.1 PNG assets
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v31-import-assets.yml']
  workflow_dispatch:
    inputs:
      archive_url:
        description: 'Direct HTTPS URL to the 127-PNG ZIP (must be downloadable without login)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: farm-world-v31-assets-import
  cancel-in-progress: false
jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0 gdown==5.2.0
      - name: Download publicly shared 127 PNG archive
        env:
          ASSET_URL: ${{ github.event.inputs.archive_url || 'https://drive.google.com/file/d/1ctf2zc0p76t6S7Qnb09zxrqK_LJlhoRm/view' }}
        run: |
          gdown --fuzzy "$ASSET_URL" -O /tmp/farm-v31-assets.zip
          python - <<'PY'
          import zipfile
          p='/tmp/farm-v31-assets.zip'
          if not zipfile.is_zipfile(p):
              raise SystemExit('Drive download did not return a ZIP; check Drive link permissions')
          print('ZIP downloaded:', len(zipfile.ZipFile(p).namelist()), 'entries')
          PY
      - name: Validate all 127 PNG files and import atomically
        run: python scripts/import_v31_asset_zip.py /tmp/farm-v31-assets.zip
      - name: Verify changed assets
        run: |
          test "$(find public/assets/v3.1 -type f -name '*.png' | wc -l)" -eq 127
          git status --short
      - name: Commit validated assets to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/v3.1
          if git diff --cached --quiet; then
            echo 'No asset changes to commit'
          else
            git commit -m 'assets(v3.1): import 127 validated PNG files'
            git push origin HEAD:main
          fi
