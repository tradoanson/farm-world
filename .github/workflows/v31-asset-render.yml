name: V3.1 Asset Render Gate
on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: 'Exactly one asset ID from assets/v3.1/manifest.json (e.g. ENV-01)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: v31-asset-sequential
  cancel-in-progress: false
jobs:
  validate-single-asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Validate independent transparent asset and ordered approvals
        run: python scripts/validate_v31_asset.py --asset-id "${{ inputs.asset_id }}"
      - name: Review reminder
        run: |
          echo "Automatic checks passed; manual visual review remains mandatory."
          echo "Do not approve until inspected in the live scene on desktop and mobile."
