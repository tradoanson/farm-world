name: Farm World CI
on:
  push:
    branches: [main, 'feature/v2-2-to-v2-9-integrated', 'experiment/farm-25d-visual']
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
